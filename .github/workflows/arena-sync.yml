name: arena:sync

on:
  schedule:
    # Daily at 06:00 UTC — well after Arena's ~daily refresh.
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - "packages/core/script/sync-arena.ts"

permissions:
  contents: write

concurrency:
  group: arena-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - name: Run arena sync
        run: bun packages/core/script/sync-arena.ts

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git -c user.email="github-actions[bot]@users.noreply.github.com" \
                -c user.name="github-actions[bot]" \
                add INTELLIGENCE.md models-arena.json models.json _meta.json
            git -c user.email="github-actions[bot]@users.noreply.github.com" \
                -c user.name="github-actions[bot]" \
                commit -m "chore(arena): refresh from Arena AI leaderboard"
            git push origin dev
            echo "::notice::Committed and pushed to dev."
          else
            echo "::notice::No changes — Arena data is up to date."
          fi

      - name: Publish to gh-pages
        # Mirror the public files onto the orphan gh-pages branch so the
        # GitHub Pages feed is updated in lockstep with dev. The Pages
        # site is served from gh-pages, not dev, so the heavy upstream
        # tree never enters the artifact upload (which was getting
        # rejected by the secret scanner). First-run repos may not have a
        # gh-pages branch yet, so create an orphan worktree when needed.
        run: |
          pages_dir="${RUNNER_TEMP:-/tmp}/models-dev-arena-gh-pages"
          rm -rf "$pages_dir"

          git fetch --no-tags --depth=1 origin gh-pages || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git worktree add -f "$pages_dir" origin/gh-pages
          else
            git worktree add -f --detach "$pages_dir"
            git -C "$pages_dir" switch --orphan gh-pages
            git -C "$pages_dir" rm -rf . >/dev/null 2>&1 || true
          fi

          cp _meta.json models-arena.json INTELLIGENCE.md \
             logo-light.svg logo-dark.svg index.html "$pages_dir"/
          cd "$pages_dir"
          # Ensure the marker file exists.
          touch .nojekyll
          git add .nojekyll _meta.json models-arena.json INTELLIGENCE.md \
                  logo-light.svg logo-dark.svg index.html
          if [[ -n "$(git status --porcelain)" ]]; then
            git -c user.email="github-actions[bot]@users.noreply.github.com" \
                -c user.name="github-actions[bot]" \
                commit -m "chore(pages): refresh public feed"
            git push origin HEAD:gh-pages
            echo "::notice::Public feed updated."
          else
            echo "::notice::Public feed is up to date."
          fi
          cd "$GITHUB_WORKSPACE"
          git worktree remove "$pages_dir" --force
